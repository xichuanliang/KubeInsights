apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeinsights-ui
  namespace: kubeinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeinsights-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeinsights-ui
    spec:
      containers:
        - name: ui
          image: kubeinsights-agent:v1
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=mock"
            - "--listen=:8080"
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubeinsights-ui
  namespace: kubeinsights
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubeinsights-ui
  ports:
    - name: http
      port: 8080
      targetPort: http

