apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeinsights-controller
  namespace: kubeinsights
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeinsights-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeinsights-controller
    spec:
      containers:
        - name: controller
          image: kubeinsights-agent:v1
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=mock"
            - "--listen=:8080"
          volumeMounts:
            - name: config
              mountPath: /etc/kubeinsights
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubeinsights-config

