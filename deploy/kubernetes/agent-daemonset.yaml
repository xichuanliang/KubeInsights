apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubeinsights-agent
  namespace: kubeinsights
  labels:
    app.kubernetes.io/name: kubeinsights-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeinsights-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeinsights-agent
    spec:
      serviceAccountName: kubeinsights-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: kubeinsights-agent:v1
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=ebpf"
            - "--listen=:8080"
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - PERFMON
                - NET_ADMIN
                - SYS_ADMIN
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: debug
              mountPath: /sys/kernel/debug
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: config
              mountPath: /etc/kubeinsights
              readOnly: true
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: config
          configMap:
            name: kubeinsights-config

